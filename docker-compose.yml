services:
  # 1. PostgreSQL 16 Enterprise Database
  postgres:
    image: postgres:16-alpine
    container_name: atscore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "${PG_PORT}:5432"
    volumes:
      - atscore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. DragonflyDB v2.0+ High-Performance In-Memory Cache
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: atscore_dragonfly
    restart: unless-stopped
    command: ["dragonfly", "--logtostderr", "--maxmemory=4GB", "--proactor_threads=4"]
    ports:
      - "${DRAGONFLY_PORT}:6379"
    volumes:
      - atscore_dfdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. AtsCore Flask Enterprise Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atscore_backend
    restart: unless-stopped
    ports:
      - "${PORT}:8000"
    environment:
      - PORT=${PORT}
      - HOST=${HOST}
      - FLASK_ENV=${FLASK_ENV}
      - SECRET_KEY=${SECRET_KEY}
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DATABASE=${PG_DATABASE}
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - DRAGONFLY_HOST=dragonfly
      - DRAGONFLY_PORT=6379
      - DRAGONFLY_DB=${DRAGONFLY_DB}
      - DRAGONFLY_POOL_DB=${DRAGONFLY_POOL_DB}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy

volumes:
  atscore_pgdata:
  atscore_dfdata:

